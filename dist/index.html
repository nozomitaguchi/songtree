<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fafaf7"><meta name="robots" content="noindex,nofollow"><title>Music Tree — nozomitaguchi</title><link rel="stylesheet" href="styles.css?v=20261004-7"><script src="app.js?v=20261004-7" defer></script></head><body style="background:#fafaf7;color:#303a33"><a class="skip" href="#history">音楽の履歴へ</a><main><section id="history" aria-label="音楽の年表"><div id="tree" class="tree"><svg id="graph" aria-hidden="true" focusable="false"></svg><ol id="history-list"></ol></div><p id="error" role="alert" hidden></p></section></main><div id="player" class="player" hidden><div class="player-info"><span class="eyebrow">SELECTED TRACK</span><strong id="playing-title"></strong><span id="audio-status"></span></div><audio id="audio" controls preload="metadata" aria-label="選択した曲の音源"></audio><label class="audio-upload">手元の音源で試す<input id="audio-file" type="file" accept="audio/*"></label><button id="close-player" aria-label="プレイヤーを閉じる">×</button><p class="upload-note">選択した音源はこの端末内で再生され、サーバーには送信されません。</p></div><dialog id="detail" aria-labelledby="detail-title"><div class="detail-top"><span id="detail-period" class="eyebrow"></span><button id="close-detail" aria-label="曲の詳細を閉じる">×</button></div><p id="detail-kind" class="eyebrow">SONG / COMMIT</p><h2 id="detail-title"></h2><p id="credits"></p><div class="detail-actions"><button id="detail-play" class="primary">手元の音源で試す</button><a id="detail-source" target="_blank" rel="noopener noreferrer" hidden>Sunoで聴く ↗</a></div><nav id="detail-tabs" aria-label="曲の情報"><button data-panel="notes" aria-pressed="true">ライナーノーツ</button><button data-panel="lyrics" aria-pressed="false">歌詞</button></nav><section id="notes-panel"><h3>作った当時</h3><p id="notes-then"></p><h3>今、聴いて</h3><p id="notes-now"></p></section><section id="lyrics-panel" hidden><h3>歌詞</h3><p id="lyrics"></p></section><section id="event-notes" hidde
